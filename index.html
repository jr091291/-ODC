<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ODC · Gobernanza de IA Responsable</title>
  <meta name="description" content="Objeto Digital de Conocimiento: Gobernanza de Inteligencia Artificial Responsable. Universidad de Cundinamarca.">
  <meta name="author" content="Karol Natalia Pardo Cortes; Jose Ricardo Pedraza Ballén">
  <link rel="stylesheet" href="./style.css">
</head>

<body data-b="0">
  <!-- Skip link para accesibilidad -->
  <a class="skip" href="#main">Saltar al contenido</a>

  <!-- Cabecera principal -->
  <header class="top">
    <div class="brand">
      Universidad de Cundinamarca · ODC
      <small>Gobernanza de Inteligencia Artificial Responsable</small>
    </div>
    <div class="top-tools">
      <button class="hb" id="bHelp" aria-haspopup="dialog">❓ Ayuda</button>
      <button class="hb" id="bFa" aria-label="Aumentar tamaño de texto">A+</button>
      <button class="hb" id="bFm" aria-label="Reducir tamaño de texto">A−</button>
    </div>
    <div class="prog" role="progressbar" aria-label="Progreso del recorrido" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <i id="pbar"></i>
    </div>
  </header>

  <!-- Contenido principal -->
  <main id="main" tabindex="-1">
    <!-- Panel avatar asistente virtual -->
    <aside id="avatarPane" aria-label="Sof-IA, asistente virtual">
      <div class="avwrap" id="avwrap">
        <img id="avImg" src="img/Avatar.png" alt="Sof-IA, asistente virtual" hidden>
        <svg id="avSvg" viewBox="0 0 200 240" role="img" aria-label="Sof-IA, avatar ilustrado de una asistente virtual">
          <defs><linearGradient id="jg" x1="0" x2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#c7d5ea"/></linearGradient></defs>
          <path d="M45 100C38 28 162 28 155 100C160 150 152 178 142 196L58 196C48 178 40 150 45 100Z" fill="#5b3a29"/>
          <path d="M26 240C26 190 58 172 100 172C142 172 174 190 174 240Z" fill="url(#jg)" stroke="#1769c9" stroke-width="3"/>
          <path d="M84 172L100 218L116 172Z" fill="#14213d"/>
          <path d="M62 190L84 172M138 190L116 172" stroke="#1769c9" stroke-width="3" stroke-linecap="round"/>
          <rect x="88" y="140" width="24" height="36" rx="10" fill="#efc09a"/>
          <ellipse cx="100" cy="105" rx="42" ry="50" fill="#f6d2b0"/>
          <path d="M57 98C58 52 142 52 143 98C126 74 84 68 57 98Z" fill="#5b3a29"/>
          <ellipse cx="84" cy="108" rx="5" ry="6.5" fill="#2b1b12"/><ellipse cx="116" cy="108" rx="5" ry="6.5" fill="#2b1b12"/>
          <circle cx="86" cy="106" r="1.6" fill="#fff"/><circle cx="118" cy="106" r="1.6" fill="#fff"/>
          <path d="M76 96Q84 91 92 95M108 95Q116 91 124 96" stroke="#3a2418" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="74" cy="124" r="6" fill="#f2a79a" opacity=".5"/><circle cx="126" cy="124" r="6" fill="#f2a79a" opacity=".5"/>
          <path class="smile" d="M87 129Q100 141 113 129" stroke="#b5483f" stroke-width="3.2" fill="none" stroke-linecap="round"/>
          <ellipse class="open" cx="100" cy="134" rx="9" ry="6" fill="#8e2f2a"/>
          <circle cx="152" cy="190" r="9" fill="#1769c9"/><text x="152" y="194" font-size="10" text-anchor="middle" fill="#fff" font-weight="700">IA</text>
        </svg>
      </div>

      <div class="avinfo">
        <p class="avname">Sof-IA</p>
        <div class="actl" role="group" aria-label="Controles de audio">
          <button class="pri" id="aPlay">▶ Escuchar</button>
          <button id="aPause" aria-pressed="false">⏸ Pausa</button>
          <button id="aStop" aria-label="Detener audio">⏹</button>
          <button id="aAuto" aria-pressed="true" title="Reproducir el audio automáticamente en cada pantalla">🔊 Auto</button>
        </div>
        <details class="tr" open>
          <summary>Transcripción</summary>
          <p id="trans"></p>
        </details>
      </div>
    </aside>

    <!-- Lienzo de contenido dinámico -->
    <section id="screen" aria-live="polite"></section>
  </main>

  <!-- Navegación inferior -->
  <nav class="foot" aria-label="Navegación del ODC">
    <button class="btn sec" id="bPrev">← Anterior</button>
    <div class="mid">
      <button class="btn sec" id="bMenu">☰ Menú</button>
      <div id="pgno"></div>
      <div class="lockmsg" id="lockmsg"></div>
    </div>
    <button class="btn" id="bNext">Continuar ▶</button>
  </nav>

  <!-- Modal para ventanas emergentes -->
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mbox">
      <button class="x" aria-label="Cerrar ventana" id="cerraModal">✕</button>
      <h3 id="mt"></h3>
      <div id="mb"></div>
    </div>
  </div>

  <script src="./javascript.js"></script>
</body>
</html>
